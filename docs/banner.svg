<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-image-cropper: image cropper for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112b"/>
      <stop offset="1" stop-color="#2a1236"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a5c"/>
      <stop offset="0.35" stop-color="#7a2e82"/>
      <stop offset="0.7" stop-color="#f0625a"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2f78"/>
      <stop offset="1" stop-color="#1b1542"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddbc3"/>
      <stop offset="1" stop-color="#4e6cf2"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="0" y="0" width="440" height="330" rx="18"/>
    </clipPath>
    <clipPath id="avatar">
      <circle cx="70" cy="70" r="70"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="196" fill="#ffffff" font-size="50" font-weight="800" letter-spacing="-1.5">compose-image-cropper</text>
    <text x="82" y="250" fill="#fcd9c4" font-size="24" font-weight="500">Image cropper for Jetpack Compose: pinch, pan,</text>
    <text x="82" y="286" fill="#fcd9c4" font-size="24" font-weight="500">rotate, aspect ratios, circle crop, Material 3 screen</text>
    <text x="82" y="348" fill="#ffb38a" font-size="20" font-family="'JetBrains Mono', Menlo, monospace">ImageCropper(state, bitmap); state.crop()</text>

    <g font-size="18" font-weight="600" fill="#ffe8dc">
      <rect x="82" y="384" width="76" height="38" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="120" y="409" text-anchor="middle">Free</text>
      <rect x="168" y="384" width="64" height="38" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="200" y="409" text-anchor="middle">1:1</text>
      <rect x="242" y="384" width="64" height="38" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="274" y="409" text-anchor="middle">4:3</text>
      <rect x="316" y="384" width="76" height="38" rx="10" fill="#ffb38a" fill-opacity="0.35"/>
      <text x="354" y="409" text-anchor="middle">16:9</text>
      <rect x="402" y="384" width="92" height="38" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="448" y="409" text-anchor="middle">Circle</text>
      <rect x="504" y="384" width="96" height="38" rx="10" fill="#ffffff" fill-opacity="0.1"/>
      <text x="552" y="409" text-anchor="middle">Rotate</text>
    </g>

    <!-- Photo with a crop frame -->
    <g transform="translate(775 96)" filter="url(#shadow)">
      <g clip-path="url(#photo)">
        <rect width="440" height="205" fill="url(#sky)"/>
        <circle cx="250" cy="124" r="120" fill="#ffc46b" fill-opacity="0.18"/><circle cx="250" cy="124" r="30" fill="#ffe9a8"/>
        <path d="M0 205 L0 150 L55 118 L105 146 L170 98 L230 140 L290 130 L350 108 L405 136 L440 124 L440 205 Z" fill="#8c4a9e"/>
        <path d="M0 205 L0 170 L45 152 L90 176 L150 148 L210 184 L265 165 L325 188 L385 155 L440 175 L440 205 Z" fill="#5c3483"/>
        <rect y="205" width="440" height="125" fill="url(#lake)"/>
        <g stroke="#ffc46b" stroke-linecap="round" stroke-width="5">
          <line x1="210" y1="218" x2="290" y2="218" stroke-opacity="0.8"/>
          <line x1="218" y1="232" x2="282" y2="232" stroke-opacity="0.6"/>
          <line x1="226" y1="246" x2="274" y2="246" stroke-opacity="0.45"/>
          <line x1="234" y1="260" x2="266" y2="260" stroke-opacity="0.3"/>
        </g>
        <g transform="translate(120 70)">
          <path d="M-22 0 A22 22 0 0 1 22 0 Q18 20 6 28 L-6 28 Q-18 20 -22 0 Z" fill="#ff5a5f"/>
          <path d="M-8 -21 Q0 -24 8 -21 L6 28 L-6 28 Z" fill="#ffd166"/>
          <rect x="-6" y="34" width="12" height="9" fill="#8b5a2b"/>
        </g>
        <g transform="translate(380 50) scale(0.8)">
          <path d="M-22 0 A22 22 0 0 1 22 0 Q18 20 6 28 L-6 28 Q-18 20 -22 0 Z" fill="#4cc9f0"/>
          <path d="M-8 -21 Q0 -24 8 -21 L6 28 L-6 28 Z" fill="#f72585"/>
          <rect x="-6" y="34" width="12" height="9" fill="#8b5a2b"/>
        </g>
        <path d="M0 0 H440 V330 H0 Z M70 52 V274 H340 V52 Z" fill="#000" fill-opacity="0.55" fill-rule="evenodd"/>
      </g>
      <!-- Grid, frame and handles -->
      <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5">
        <line x1="160" y1="52" x2="160" y2="274"/>
        <line x1="250" y1="52" x2="250" y2="274"/>
        <line x1="70" y1="126" x2="340" y2="126"/>
        <line x1="70" y1="200" x2="340" y2="200"/>
      </g>
      <rect x="70" y="52" width="270" height="222" fill="none" stroke="#ffffff" stroke-width="2"/>
      <g stroke="#ffffff" stroke-width="6" stroke-linecap="square" fill="none">
        <path d="M68 76 V50 H94"/>
        <path d="M316 50 H342 V76"/>
        <path d="M68 250 V276 H94"/>
        <path d="M316 276 H342 V250"/>
        <path d="M193 50 H217"/>
        <path d="M193 276 H217"/>
        <path d="M68 151 V175"/>
        <path d="M342 151 V175"/>
      </g>
      <!-- Pinch hint -->
      <g fill="#ffffff" fill-opacity="0.9">
        <circle cx="178" cy="160" r="9"/>
        <circle cx="236" cy="214" r="9"/>
      </g>
      <path d="M186 168 L228 206" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 5"/>
    </g>

    <!-- Circle avatar result -->
    <g transform="translate(1085 330)" filter="url(#shadow)">
      <g clip-path="url(#avatar)">
        <rect width="140" height="140" fill="url(#face)"/>
        <circle cx="70" cy="62" r="40" fill="#3b2416"/>
        <path d="M22 140 C24 112 46 104 70 104 C94 104 116 112 118 140 Z" fill="#f4a340"/>
        <rect x="60" y="88" width="20" height="20" fill="#f2c29b"/>
        <ellipse cx="70" cy="70" rx="29" ry="32" fill="#f2c29b"/>
        <path d="M40 66 C38 38 100 32 100 64 Q76 48 40 66 Z" fill="#3b2416"/>
        <circle cx="60" cy="72" r="3.5" fill="#2b1b12"/>
        <circle cx="80" cy="72" r="3.5" fill="#2b1b12"/>
        <path d="M62 84 Q70 91 78 84" stroke="#b5534a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <circle cx="70" cy="70" r="70" fill="none" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>
</svg>
